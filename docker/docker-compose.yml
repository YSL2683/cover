services:
  cover:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cover:latest
    container_name: cover_training
    working_dir: /workspace/cover
    ipc: host
    shm_size: 32gb
    stdin_open: true
    tty: true
    environment:
      - MUJOCO_GL=egl
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMP_NUM_THREADS=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ..:/workspace/cover
      - ~/.netrc:/root/.netrc:ro
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash
